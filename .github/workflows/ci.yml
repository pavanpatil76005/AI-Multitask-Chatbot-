name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t ai-multitask-backend ./backend
      - name: Run PostgreSQL and backend
        run: |
          docker network create chatbot-test
          docker run -d --name chatbot-db --network chatbot-test \
            -e POSTGRES_DB=ai_chatbot -e POSTGRES_USER=chatbot \
            -e POSTGRES_PASSWORD=ci-only-password \
            --health-cmd="pg_isready -U chatbot -d ai_chatbot" \
            --health-interval=2s --health-retries=30 postgres:17-alpine
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' chatbot-db)" = healthy ]; then break; fi
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' chatbot-db)" = healthy
          docker run -d --name chatbot-api --network chatbot-test -p 8001:8000 \
            -e DATABASE_URL=postgresql://chatbot:ci-only-password@chatbot-db/ai_chatbot \
            -e SECRET_KEY=ci-only-secret-at-least-thirty-two-characters \
            ai-multitask-backend
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8001/health/database; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8001/health/database
          curl --fail --output /dev/null http://127.0.0.1:8001/docs
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs chatbot-api || true
          docker rm -f chatbot-api chatbot-db || true
          docker network rm chatbot-test || true

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ai_chatbot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_chatbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: ai_chatbot
      DB_USER: postgres
      DB_PASSWORD: test-password
      SECRET_KEY: ci-only-secret-key-with-at-least-sixty-four-random-characters
      CORS_ORIGINS: http://localhost:3000
      GEMINI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip check
      - run: alembic upgrade head
      - run: alembic check
      - run: python -W error::ResourceWarning -m unittest discover -s tests -p "test_*.py"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx tsc --noEmit --incremental false
